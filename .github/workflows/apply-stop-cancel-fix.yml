name: Apply Stop Generation cancel separation fix

on:
  push:
    branches:
      - fix/stop-generation-cancel-separation
    paths:
      - .github/workflows/apply-stop-cancel-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stop-generation-cancel-separation
          fetch-depth: 0

      - name: Patch native cancellation flags
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/src/main/cpp/native-lib.cpp')
          s = p.read_text()

          old = 'std::atomic<bool> g_cancel_generation{false};'
          assert s.count(old) == 1, 'cancel flag declaration not found exactly once'
          s = s.replace(old, 'std::atomic<bool> g_cancel_talk_generation{false};\nstd::atomic<bool> g_cancel_ai_generation{false};', 1)

          old_sig = '''    const std::function<void(double)> & on_ttft = nullptr,\n    const std::function<void(int32_t, int32_t, double, double, double, double, double, int32_t)> & on_metrics = nullptr\n) {'''
          new_sig = '''    const std::function<void(double)> & on_ttft = nullptr,\n    const std::function<void(int32_t, int32_t, double, double, double, double, double, int32_t)> & on_metrics = nullptr,\n    const std::atomic<bool> * cancel_flag = nullptr\n) {'''
          assert s.count(old_sig) == 1, 'generate_sampling_locked signature not found exactly once'
          s = s.replace(old_sig, new_sig, 1)

          old_check = 'if (g_cancel_generation.load()) {'
          assert s.count(old_check) >= 1, 'cancellation checks not found'
          s = s.replace(old_check, 'if (cancel_flag != nullptr && cancel_flag->load()) {')

          # Keep the existing legacy cancellation resets harmless; the two active UI
          # generation paths below get their own independent flags.
          def patch_function(body, name, flag, call_flag):
              start = body.find(name)
              assert start >= 0, f'{name} not found'
              next_extern = body.find('extern "C" JNIEXPORT', start + len(name))
              if next_extern < 0:
                  end = len(body)
              else:
                  end = next_extern
              part = body[start:end]
              assert part.count('g_cancel_generation.store(false);') == 1, f'{name}: reset not found exactly once'
              part = part.replace('g_cancel_generation.store(false);', f'{flag}.store(false);', 1)
              # The active call contains "generate_sampling_locked(" exactly once.
              pos = part.find('generate_sampling_locked(')
              assert pos >= 0, f'{name}: generate call not found'
              # Add the flag as the final argument immediately before the closing call.
              # Locate the call's matching closing parenthesis.
              depth = 0
              quote = None
              esc = False
              close = None
              for i in range(pos, len(part)):
                  c = part[i]
                  if quote:
                      if esc: esc = False
                      elif c == '\\\\': esc = True
                      elif c == quote: quote = None
                      continue
                  if c in ('"', "'"):
                      quote = c
                      continue
                  if c == '(':
                      depth += 1
                  elif c == ')':
                      depth -= 1
                      if depth == 0:
                          close = i
                          break
              assert close is not None, f'{name}: could not find generate call end'
              before = part[:close].rstrip()
              after = part[close:]
              if not before.endswith(','):
                  before += ','
              before += f'\\n        &{call_flag}'
              part = before + after
              return body[:start] + part + body[end:]

          # The helper above is intentionally strict: fail rather than silently
          # changing the wrong generation path.
          s = patch_function(
              s,
              'Java_com_example_MainActivity_nativeGenerateWithSampling(',
              'g_cancel_ai_generation',
              'g_cancel_ai_generation'
          )
          s = patch_function(
              s,
              'Java_com_example_MainActivity_nativeGenerateStream(',
              'g_cancel_talk_generation',
              'g_cancel_talk_generation'
          )

          old_cancel = '''extern "C" JNIEXPORT void JNICALL\nJava_com_example_MainActivity_nativeCancelGeneration(JNIEnv *, jobject) {\n    g_cancel_generation.store(true);\n}'''
          new_cancel = '''extern "C" JNIEXPORT void JNICALL\nJava_com_example_MainActivity_nativeCancelGeneration(JNIEnv *, jobject) {\n    g_cancel_talk_generation.store(true);\n}\n\nextern "C" JNIEXPORT void JNICALL\nJava_com_example_MainActivity_nativeCancelAiGeneration(JNIEnv *, jobject) {\n    g_cancel_ai_generation.store(true);\n}'''
          assert old_cancel in s, 'nativeCancelGeneration block not found'
          s = s.replace(old_cancel, new_cancel, 1)

          p.write_text(s)

      - name: Patch MainActivity native API routing
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/example/MainActivity.kt')
          s = p.read_text()
          old = '  private external fun nativeCancelGeneration()\n'
          new = '  private external fun nativeCancelGeneration()\n  private external fun nativeCancelAiGeneration()\n'
          assert s.count(old) == 1, 'nativeCancelGeneration declaration not found exactly once'
          s = s.replace(old, new, 1)

          old = '          onCancelGenerate = { nativeCancelGeneration() },'
          new = '          onCancelGenerate = { nativeCancelAiGeneration() },'
          assert s.count(old) == 1, 'AI cancel callback not found exactly once'
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/cpp/native-lib.cpp app/src/main/java/com/example/MainActivity.kt
          git commit -m "fix: separate talk and AI generation cancellation" || exit 0
          git push origin fix/stop-generation-cancel-separation
