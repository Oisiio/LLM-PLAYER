name: Fix Persistent Sampling Input

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix persistent numeric input
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/example/MainActivity.kt')
          text = path.read_text()

          pattern = re.compile(r'@Composable\nprivate fun PersistentNumberInput\(label: String, value: String, keyboardType: KeyboardType, onCommit: \(String\) -> Boolean\) \{.*?\n\}\n\n@Composable\nprivate fun LabeledInput', re.S)
          replacement = '''@Composable
private fun PersistentNumberInput(label: String, value: String, keyboardType: KeyboardType, onCommit: (String) -> Boolean) {
  var text by rememberSaveable(label) { mutableStateOf(value) }
  var focused by remember { mutableStateOf(false) }

  LaunchedEffect(value) {
    if (!focused) text = value
  }

  fun commit() {
    if (onCommit(text)) {
      text = text.trim()
    } else if (text != value) {
      text = value
    }
  }

  OutlinedTextField(
    value = text,
    onValueChange = { text = it },
    modifier = Modifier
      .fillMaxWidth()
      .onFocusChanged { state ->
        if (focused && !state.isFocused) commit()
        focused = state.isFocused
      },
    label = { Text(label) },
    singleLine = true,
    keyboardOptions = KeyboardOptions(keyboardType = keyboardType, imeAction = ImeAction.Done),
    keyboardActions = KeyboardActions(onDone = { commit() })
  )
}

@Composable
private fun LabeledInput'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('PersistentNumberInput block not found')
          path.write_text(updated)
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-persistent-input.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/MainActivity.kt .github/workflows/fix-persistent-input.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: persist default sampling input edits [skip-fix]'
          git push
