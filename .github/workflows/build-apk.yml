name: Build APK

on:
  push:
    branches: [ "main", "master", "phase-3a", "phase-3b-1" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout llama.cpp at fixed commit
        run: |
          # The repository may contain a vendored third_party/llama.cpp directory.
          # Remove it before cloning so the CI checkout cannot fail with
          # "destination path ... already exists and is not an empty directory".
          rm -rf third_party/llama.cpp
          mkdir -p third_party
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          cd third_party/llama.cpp
          git fetch --depth 1 origin 4e97ac86ebe2c4cb8212d98d2641ad6768810896
          git checkout --detach 4e97ac86ebe2c4cb8212d98d2641ad6768810896
          test "$(git rev-parse HEAD)" = "4e97ac86ebe2c4cb8212d98d2641ad6768810896"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
