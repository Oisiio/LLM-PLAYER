name: Apply Stop Generation cancel separation fix v2

on:
  push:
    branches:
      - fix/stop-generation-cancel-separation
    paths:
      - .github/workflows/apply-stop-cancel-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stop-generation-cancel-separation
          fetch-depth: 0

      - name: Patch source
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/cpp/native-lib.cpp')
          s = p.read_text()

          marker = 'std::string piece_for_token(const llama_vocab * vocab, llama_token token) {'
          start = s.find(marker)
          assert start >= 0
          insert_at = s.find('\n}\n\n', start)
          assert insert_at >= 0
          insert_at += 3
          helper = r'''

// Convert standard UTF-8 to UTF-16 for JNI without using NewStringUTF().
// NewStringUTF() expects Modified UTF-8 and can abort when a llama.cpp token
// piece contains an incomplete or standard multi-byte UTF-8 sequence.
bool append_complete_utf8_to_utf16(const std::string & input, size_t & consumed, std::vector<jchar> & output) {
    consumed = 0;
    while (consumed < input.size()) {
        const uint8_t b0 = static_cast<uint8_t>(input[consumed]);
        uint32_t cp = 0;
        size_t needed = 0;

        if (b0 <= 0x7F) {
            cp = b0;
            needed = 1;
        } else if (b0 >= 0xC2 && b0 <= 0xDF) {
            needed = 2;
            if (input.size() - consumed < needed) break;
            const uint8_t b1 = static_cast<uint8_t>(input[consumed + 1]);
            if ((b1 & 0xC0) != 0x80) { cp = 0xFFFD; needed = 1; }
            else cp = ((b0 & 0x1F) << 6) | (b1 & 0x3F);
        } else if (b0 >= 0xE0 && b0 <= 0xEF) {
            needed = 3;
            if (input.size() - consumed < needed) break;
            const uint8_t b1 = static_cast<uint8_t>(input[consumed + 1]);
            const uint8_t b2 = static_cast<uint8_t>(input[consumed + 2]);
            const bool valid = (b1 & 0xC0) == 0x80 && (b2 & 0xC0) == 0x80 &&
                !(b0 == 0xE0 && b1 < 0xA0) &&
                !(b0 == 0xED && b1 >= 0xA0);
            if (!valid) { cp = 0xFFFD; needed = 1; }
            else cp = ((b0 & 0x0F) << 12) | ((b1 & 0x3F) << 6) | (b2 & 0x3F);
        } else if (b0 >= 0xF0 && b0 <= 0xF4) {
            needed = 4;
            if (input.size() - consumed < needed) break;
            const uint8_t b1 = static_cast<uint8_t>(input[consumed + 1]);
            const uint8_t b2 = static_cast<uint8_t>(input[consumed + 2]);
            const uint8_t b3 = static_cast<uint8_t>(input[consumed + 3]);
            const bool valid = (b1 & 0xC0) == 0x80 && (b2 & 0xC0) == 0x80 && (b3 & 0xC0) == 0x80 &&
                !(b0 == 0xF0 && b1 < 0x90) &&
                !(b0 == 0xF4 && b1 >= 0x90);
            if (!valid) { cp = 0xFFFD; needed = 1; }
            else cp = ((b0 & 0x07) << 18) | ((b1 & 0x3F) << 12) | ((b2 & 0x3F) << 6) | (b3 & 0x3F);
        } else {
            cp = 0xFFFD;
            needed = 1;
        }

        if (needed > input.size() - consumed) break;
        if (cp <= 0xFFFF) {
            output.push_back(static_cast<jchar>(cp));
        } else if (cp <= 0x10FFFF) {
            cp -= 0x10000;
            output.push_back(static_cast<jchar>(0xD800 + (cp >> 10)));
            output.push_back(static_cast<jchar>(0xDC00 + (cp & 0x3FF)));
        } else {
            output.push_back(static_cast<jchar>(0xFFFD));
        }
        consumed += needed;
    }
    return consumed > 0;
}

jstring new_jstring_from_utf8(JNIEnv * env, const std::string & input) {
    size_t consumed = 0;
    std::vector<jchar> utf16;
    append_complete_utf8_to_utf16(input, consumed, utf16);
    if (consumed != input.size()) {
        // The caller normally buffers incomplete token pieces. For complete
        // strings, replace any malformed/incomplete trailing bytes safely.
        utf16.push_back(static_cast<jchar>(0xFFFD));
    }
    return env->NewString(utf16.empty() ? nullptr : utf16.data(), static_cast<jsize>(utf16.size()));
}
'''
          assert 'new_jstring_from_utf8(JNIEnv * env' not in s
          s = s[:insert_at] + helper + s[insert_at:]

          marker = 'extern "C" JNIEXPORT jstring JNICALL\nJava_com_example_MainActivity_nativeGenerateStream('
          start = s.find(marker); assert start >= 0
          end = s.find('extern "C" JNIEXPORT void JNICALL\nJava_com_example_MainActivity_nativeCancelGeneration', start)
          assert end >= 0
          part = s[start:end]

          old = '''    std::string raw_text;\n    std::string status_or_err;'''
          new = '''    std::string raw_text;\n    std::string status_or_err;\n    std::string pending_utf8;'''
          assert old in part
          part = part.replace(old, new, 1)

          old = '''                if (token_callback != nullptr && on_token_mid != nullptr && len > 0) {\n                    jstring jpiece = env->NewStringUTF(std::string(piece, static_cast<size_t>(len)).c_str());\n                    if (jpiece != nullptr) {\n                        env->CallVoidMethod(token_callback, on_token_mid, jpiece);\n                        env->DeleteLocalRef(jpiece);\n                    }\n                }'''
          new = '''                if (token_callback != nullptr && on_token_mid != nullptr && len > 0) {\n                    pending_utf8.append(piece, static_cast<size_t>(len));\n                    size_t consumed = 0;\n                    std::vector<jchar> utf16;\n                    append_complete_utf8_to_utf16(pending_utf8, consumed, utf16);\n                    if (consumed > 0) {\n                        pending_utf8.erase(0, consumed);\n                        jstring jpiece = env->NewString(utf16.empty() ? nullptr : utf16.data(), static_cast<jsize>(utf16.size()));\n                        if (jpiece != nullptr) {\n                            env->CallVoidMethod(token_callback, on_token_mid, jpiece);\n                            env->DeleteLocalRef(jpiece);\n                        }\n                    }\n                }'''
          assert old in part
          part = part.replace(old, new, 1)

          old = '''    env->ReleaseStringUTFChars(prompt, chars);\n    if (status_or_err.rfind("ERROR:", 0) == 0) {\n        return env->NewStringUTF(status_or_err.c_str());\n    }\n    return env->NewStringUTF(raw_text.c_str());'''
          new = '''    env->ReleaseStringUTFChars(prompt, chars);\n    if (status_or_err.rfind("ERROR:", 0) == 0) {\n        return new_jstring_from_utf8(env, status_or_err);\n    }\n    if (!pending_utf8.empty()) {\n        // A cancelled generation may end immediately after a multi-byte token\n        // fragment. Do not pass that fragment through NewStringUTF().\n        raw_text.append(pending_utf8);\n    }\n    return new_jstring_from_utf8(env, raw_text);'''
          assert old in part
          part = part.replace(old, new, 1)
          s = s[:start] + part + s[end:]
          p.write_text(s)

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/cpp/native-lib.cpp
          git commit -m "fix: safely bridge UTF-8 token pieces to JNI"
          git push origin fix/stop-generation-cancel-separation
