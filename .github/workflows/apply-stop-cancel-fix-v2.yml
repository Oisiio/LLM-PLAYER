name: Apply Stop Generation cancel separation fix v2

on:
  push:
    branches:
      - fix/stop-generation-cancel-separation
    paths:
      - .github/workflows/apply-stop-cancel-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stop-generation-cancel-separation
          fetch-depth: 0

      - name: Patch source
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/cpp/native-lib.cpp')
          s = p.read_text()
          old = 'std::atomic<bool> g_cancel_generation{false};'
          assert s.count(old) == 1
          s = s.replace(old, old + '\nstd::atomic<bool> g_cancel_talk_generation{false};\nstd::atomic<bool> g_cancel_ai_generation{false};', 1)
          old_sig = '''    const std::function<void(double)> & on_ttft = nullptr,\n    const std::function<void(int32_t, int32_t, double, double, double, double, double, int32_t)> & on_metrics = nullptr\n) {'''
          new_sig = '''    const std::function<void(double)> & on_ttft = nullptr,\n    const std::function<void(int32_t, int32_t, double, double, double, double, double, int32_t)> & on_metrics = nullptr,\n    const std::atomic<bool> * cancel_flag = nullptr\n) {'''
          assert s.count(old_sig) == 1
          s = s.replace(old_sig, new_sig, 1)
          old_check = 'if (g_cancel_generation.load()) {'
          assert s.count(old_check) >= 3
          s = s.replace(old_check, 'if (cancel_flag != nullptr && cancel_flag->load()) {')

          marker = 'Java_com_example_MainActivity_nativeGenerateWithSampling('
          start = s.find(marker); assert start >= 0
          end = s.find('extern "C" JNIEXPORT', start + len(marker)); assert end >= 0
          part = s[start:end]
          assert part.count('g_cancel_generation.store(false);') == 1
          part = part.replace('g_cancel_generation.store(false);', 'g_cancel_ai_generation.store(false);', 1)
          call = 'return generate_sampling_locked(chars, temperature, top_k, top_p, min_p, typical_p, repetition_penalty, penalty_last_n, seed, enable_thinking == JNI_TRUE);'
          assert call in part
          replacement = 'return generate_sampling_locked(chars, temperature, top_k, top_p, min_p, typical_p, repetition_penalty, penalty_last_n, seed, enable_thinking == JNI_TRUE, nullptr, nullptr, nullptr, nullptr, &g_cancel_ai_generation);'
          part = part.replace(call, replacement, 1)
          s = s[:start] + part + s[end:]

          marker = 'Java_com_example_MainActivity_nativeGenerateStream('
          start = s.find(marker); assert start >= 0
          end = s.find('extern "C" JNIEXPORT', start + len(marker)); assert end >= 0
          part = s[start:end]
          assert part.count('g_cancel_generation.store(false);') == 1
          part = part.replace('g_cancel_generation.store(false);', 'g_cancel_talk_generation.store(false);', 1)
          needle = '''            }\n        );'''
          assert part.count(needle) == 1
          part = part.replace(needle, '''            },\n            &g_cancel_talk_generation\n        );''', 1)
          s = s[:start] + part + s[end:]

          old_cancel = '''extern "C" JNIEXPORT void JNICALL\nJava_com_example_MainActivity_nativeCancelGeneration(JNIEnv * /* env */, jobject /* this */) {\n    g_cancel_generation.store(true);\n}'''
          new_cancel = '''extern "C" JNIEXPORT void JNICALL\nJava_com_example_MainActivity_nativeCancelGeneration(JNIEnv * /* env */, jobject /* this */) {\n    g_cancel_talk_generation.store(true);\n}\n\nextern "C" JNIEXPORT void JNICALL\nJava_com_example_MainActivity_nativeCancelAiGeneration(JNIEnv * /* env */, jobject /* this */) {\n    g_cancel_ai_generation.store(true);\n}'''
          assert old_cancel in s
          s = s.replace(old_cancel, new_cancel, 1)
          p.write_text(s)

          p = Path('app/src/main/java/com/example/MainActivity.kt')
          s = p.read_text()
          old = '  private external fun nativeCancelGeneration()\n'
          new = '  private external fun nativeCancelGeneration()\n  private external fun nativeCancelAiGeneration()\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '          onCancelGenerate = { nativeCancelGeneration() },'
          new = '          onCancelGenerate = { nativeCancelAiGeneration() },'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/cpp/native-lib.cpp app/src/main/java/com/example/MainActivity.kt
          git commit -m "fix: separate talk and AI generation cancellation"
          git push origin fix/stop-generation-cancel-separation
